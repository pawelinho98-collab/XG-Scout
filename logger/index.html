<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilica Logger</title>
<style>
:root{--bg:#12161C;--card:#1C222B;--line:#2C3440;--chip:#252D38;--chipb:#3A4553;--tx:#E8ECF1;--mut:#9AA6B5;--sub:#C5CEDA;--acc:#7CC4FF;--acct:#0B1520;--riv:#FFB066;--bad:#FF8A80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header .score{font-size:18px;font-weight:600;flex:1 1 260px;min-width:0}
header .score small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lbl{font-size:12px;color:var(--mut);margin-bottom:6px}
.inp{min-height:40px;padding:0 10px;border-radius:8px;background:var(--bg);border:1px solid var(--chipb)}
textarea.inp{padding:10px;min-height:160px;width:100%}
.chip,.btn{min-height:40px;padding:0 12px;border-radius:8px;background:var(--chip);border:1px solid var(--chipb)}
.chip.on,.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acct);font-weight:600}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
main{padding:16px;display:flex;flex-direction:column;gap:16px}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.left{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
@media(min-width:1100px){#panelCard{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow-y:auto}}
.right{flex:1 1 440px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{margin:0 0 10px;font-size:16px}
.card h3{margin:14px 0 8px;font-size:14px}
svg.pitch{width:100%;height:auto;display:block;border-radius:8px;background:#1F3A2D;touch-action:manipulation}
svg.pitch.click{cursor:crosshair}
.fld{margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.num{display:flex;align-items:center;gap:12px}
.num button{width:48px;height:48px;border-radius:8px;background:var(--chip);border:1px solid var(--chipb);font-size:22px}
.num button.pri{background:var(--acc);color:var(--acct);border-color:var(--acc)}
.num span{min-width:40px;text-align:center;font-size:26px;font-weight:600}
.goal{display:grid;grid-template-columns:repeat(3,56px);gap:4px;padding:6px;border:2px solid var(--sub);border-bottom:0;border-radius:6px 6px 0 0;width:max-content}
.goal button{height:40px;border-radius:6px;background:var(--chip);border:1px solid var(--chipb)}
.goal button.on{background:var(--acc);border-color:var(--acc)}
.auto{padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:14px}
.auto b{color:var(--acc)}
.err{color:var(--bad);margin-bottom:10px}
.evbtn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.evbtn button{min-height:56px;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600}
.evbtn kbd{font:500 12px system-ui;color:var(--mut)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--mut)}
td.num,th.num{text-align:right}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#222a35}
.tag{color:var(--acc)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:13px;color:var(--sub)}
.legend div{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.hint{color:var(--sub);font-size:13px}
</style>
</head>
<body>
<header>
<div class="score" id="score"></div>
<div class="row"><select class="inp" id="matchSel" aria-label="Mecz"></select></div>
<div class="row" id="halfRow"></div>
<div class="row"><label for="minInp" style="font-size:12px;color:var(--mut)">Minuta</label><input class="inp" id="minInp" type="number" min="1" max="130" style="width:76px">
<label for="vtInp" style="font-size:12px;color:var(--mut)">Czas wideo</label><input class="inp" id="vtInp" type="text" placeholder="mm:ss" style="width:86px"></div>
<nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* ---------- dane ---------- */
var KEY='pilicaLogger.v1';
var ROSTER0=['Paweł Wróbel','Kamil Frukacz','Bartłomiej Wiśniewski','Dominik Leśniak','Dawid Kowalski','Kamil Sztymala','Radosław Płatek','Mateusz Przybyła','Stanisław Leśniak','Dominik Woszczyna','Daniel Żakowski','Maksymilian Wochnik','Przemysław Winckowicz','Kacper Kożuch','Kacper Tomzik','Mateusz Wasilewski','Marcin Kowalski','Konrad Waluda','A. El Kessouati','Kacper Druciarz','Jakub Jamrozik','Szymon Dylewski','Filip Ziółkowski','Paweł Janik'];
var DB={roster:ROSTER0.slice(),matches:[],cur:null};
var memOnly=false;
function loadDB(){try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&d.matches){DB=d;}}}catch(e){memOnly=true;}}
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){memOnly=true;}}
var UI={tab:'log',half:1,pts:[],form:null,err:'',confirm:null,
 map:{scope:'Ten mecz',team:'Obie',period:'Cały mecz',view:'Punkty',player:'Wszyscy',types:{shot:true,duel:true,air:true,odb:true,str:true,wej:false,cross:false,sfg:false}},
 sum:{scope:'Ten mecz'},msg:''};
function M(){for(var i=0;i<DB.matches.length;i++){if(DB.matches[i].id===DB.cur){return DB.matches[i];}}return null;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(s){return document.querySelector(s);}
function shortName(n){
 var t=String(n).trim().split(/\s+/);if(t.length<2){return n;}
 var s=t.slice(1).join(' ');
 var dup=DB.roster.filter(function(r){var q=r.trim().split(/\s+/);return q.slice(1).join(' ')===s;}).length>1;
 return dup?t[0].charAt(0)+'. '+s:s;
}
function disp(v){return DB.roster.indexOf(v)>=0?shortName(v):v;}
function f2(n){return (Math.round(n*100)/100).toFixed(2).replace('.',',');}
function f3(n){return (Math.round(n*1000)/1000).toFixed(3).replace('.',',');}

/* ---------- skład ---------- */
function lineup(m){if(!m.lineup){m.lineup={start:[],bench:[],subs:[]};}return m.lineup;}
function absMin(e){return Number(e.min)||0;}
function onPitch(m,minute){
 var L=lineup(m);if(!L.start.length){return DB.roster.slice();}
 var on=L.start.map(function(p){return p.n;});
 L.subs.slice().sort(function(a,b){return a.min-b.min;}).forEach(function(s){
  if(s.min<=minute){var i=on.indexOf(s.out);if(i>=0){on.splice(i,1);}if(on.indexOf(s.inn)<0){on.push(s.inn);}}
 });
 return on;
}
function intervals(m){
 var L=lineup(m),len=Number(m.len)||90,r={};
 L.start.forEach(function(p){r[p.n]={pos:p.pos||'',from:0,to:len,start:'XI'};});
 L.bench.forEach(function(n){if(!r[n]){r[n]={pos:'',from:null,to:null,start:'Ławka'};}});
 L.subs.slice().sort(function(a,b){return a.min-b.min;}).forEach(function(s){
  if(r[s.out]&&r[s.out].from!==null){r[s.out].to=Math.min(r[s.out].to,s.min);}
  if(!r[s.inn]){r[s.inn]={pos:'',from:null,to:null,start:'Ławka'};}
  r[s.inn].from=s.min;r[s.inn].to=len;if(s.pos){r[s.inn].pos=s.pos;}
 });
 Object.keys(r).forEach(function(n){r[n].min=r[n].from===null?0:Math.max(0,r[n].to-r[n].from);});
 return r;
}

/* ---------- xG: wzór z XG Scout + korekta Pilica ---------- */
var BODY={'Lepsza noga':'Strong Foot','Słabsza noga':'Weak Foot','Głowa':'Header','Inna':'Other'};
var PRESS={'Niska · ponad 2 m':'Low','Średnia · 1–2 m':'Med','Wysoka · poniżej 1 m':'High'};
function geom(x,y,team){
 var gx=team==='R'?0:105,gy=34;
 var dist=Math.round(Math.sqrt((gx-x)*(gx-x)+(gy-y)*(gy-y))*10)/10;
 var a1=Math.atan2(gy-3.66-y,gx-x),a2=Math.atan2(gy+3.66-y,gx-x),ad=Math.abs(a2-a1);
 if(ad>Math.PI){ad=Math.abs(ad-2*Math.PI);}
 return {dist:dist,angle:Math.round(ad*1800/Math.PI)/10};
}
function isSam(e){return e.gk==='W bramce'&&e.def==='0';}
function shotCalc(e){
 var g=geom(e.x,e.y,e.team);
 if(e.phase==='Karny'){return {dist:g.dist,angle:g.angle,app:0.77,xg:0.77};}
 var fwd=e.team==='R'?e.x:105-e.x,wide=Math.abs(e.y-34)/3.66>1.5;
 var glp=(fwd<2&&wide)?-2.5:(fwd<5&&wide)?-1.2:0;
 var bp=BODY[e.body],pr=PRESS[e.press];
 var si=isSam(e)?0.70:e.phase==='Kontra'?0.15:e.phase==='SFG'?-0.1:0;
 var at=e.atype;
 var as=at==='Prostopadłe'?0.25:at==='Dośrodkowanie'?0.15:at==='Rzut rożny'?0.05:(at==='Brak'||at==='Akcja indywidualna')?0:0.1;
 var l=-0.75+(-0.09*g.dist)+(g.dist<6?(6-g.dist)*0.08:0)+0.015*g.angle+glp
  +(bp==='Header'?-0.15:bp==='Weak Foot'?-0.2:0)+si+as+(pr==='Low'?0.25:pr==='High'?-0.35:0);
 var app=Math.round(1000/(1+Math.exp(-l)))/1000;
 var a=Math.min(0.999,Math.max(0.001,app));
 var z=0.593+1.566*Math.log(a/(1-a))+(pr==='High'?-1.153:0)+(bp==='Header'?-0.55:0);
 return {dist:g.dist,angle:g.angle,app:app,xg:Math.round(1000/(1+Math.exp(-z)))/1000};
}
function inBigZone(x,y,team){
 var d=team==='R'?x:105-x,w=Math.abs(y-34);
 return d<=20.15&&w<=20.16&&(d>=16.5||w<=3.66+d);
}

/* ---------- definicje zdarzeń ---------- */
var TYPES=[['shot','Strzał','S'],['duel','Pojedynek','P'],['odb','Odbiór','O'],['str','Strata','T'],['wej','Wejście w pole karne','W'],['cross','Dośrodkowanie','D'],['sfg','Stały fragment gry','F']];
var TNAME={};TYPES.forEach(function(t){TNAME[t[0]]=t[1];});
var TN=['Tak','Nie'],TEAM=['Pilica','Rywal'];
var SPOTS=['Góra, lewa','Góra, środek','Góra, prawa','Środek, lewa','Środek','Środek, prawa','Dół, lewa','Dół, środek','Dół, prawa'];
var OUTS={'Obrona|Wygrany':['Przejęcie','Przejęcie do kontry','Wybicie','Faul rywala'],'Obrona|Przegrany':['Rywal przeszedł','Nasz faul'],'Atak|Wygrany':['Minięcie lub utrzymanie piłki','Faul na nas'],'Atak|Przegrany':['Strata','Strata do kontry','Wybicie rywala','Nasz faul']};
function pl(){var m=M();var a=m?onPitch(m,Number($('#minInp').value)||0):DB.roster.slice();return a;}
function plB(){return ['Brak'].concat(pl());}
function isP(f){return f.team==='Pilica';}
var DEFS={
 shot:{d:{team:'Pilica',player:'',assist:'Brak',body:'Lepsza noga',air:'Tak',airOpp:'Brak',phase:'Atak pozycyjny',atype:'Brak',press:'Średnia · 1–2 m',def:'1',gk:'W bramce',res:'Niecelny',spot:'',blocker:'Brak',setka:'Nie',note:''},
  f:[{k:'team',l:'Drużyna',o:TEAM},{k:'player',l:'Strzelec',o:pl,show:isP},{k:'assist',l:'Asysta',o:plB,show:isP},
   {k:'body',l:'Część ciała',o:Object.keys(BODY)},
   {k:'air',l:'Główka: czy był pojedynek w powietrzu?',o:TN,show:function(f){return f.body==='Głowa';}},
   {k:'airOpp',l:'Kto z naszych walczył w powietrzu',o:plB,show:function(f){return f.body==='Głowa'&&f.air==='Tak'&&!isP(f);}},
   {k:'phase',l:'Faza akcji',o:['Atak pozycyjny','Kontra','SFG','Karny']},
   {k:'atype',l:'Typ asysty',o:['Brak','Podanie kluczowe','Prostopadłe','Dośrodkowanie','Wycofanie','Rzut rożny','Rzut wolny','Dobitka','Akcja indywidualna'],show:function(f){return f.phase!=='Karny';}},
   {k:'press',l:'Presja: odległość najbliższego rywala',o:Object.keys(PRESS),show:function(f){return f.phase!=='Karny';}},
   {k:'def',l:'Obrońcy z pola w świetle bramki',o:['0','1','2','3+'],show:function(f){return f.phase!=='Karny';}},
   {k:'gk',l:'Bramkarz',o:['W bramce','Pusta bramka'],show:function(f){return f.phase!=='Karny';}},
   {k:'res',l:'Wynik strzału',o:['Gol','Obroniony','Zablokowany','Niecelny','Słupek lub poprzeczka']},
   {k:'spot',l:'Miejsce w bramce',type:'grid',show:function(f){return f.res==='Gol'||f.res==='Obroniony';}},
   {k:'blocker',l:'Kto zablokował',o:plB,show:function(f){return f.res==='Zablokowany'&&!isP(f);}},
   {k:'setka',l:'Setka (ocena własna)',o:TN}]},
 duel:{d:{kind:'1v1 / drybling',side:'Obrona',player:'',res:'Wygrany',out:'Przejęcie',card:'Brak',goal:'Nie',note:''},
  f:[{k:'kind',l:'Typ',o:['1v1 / drybling','W powietrzu']},{k:'side',l:'Pilica była w',o:['Atak','Obrona']},{k:'player',l:'Zawodnik Pilicy',o:pl},
   {k:'res',l:'Wynik',o:['Wygrany','Przegrany']},{k:'out',l:'Skutek',o:function(f){return OUTS[f.side+'|'+f.res];}},
   {k:'card',l:'Kartka',o:['Brak','Żółta','Czerwona'],show:function(f){return f.out.indexOf('aul')>=0;}},
   {k:'goal',l:'Doprowadziło do bramki',o:TN,show:function(f){return /Przejęcie|Strata/.test(f.out);}}]},
 odb:{d:{team:'Pilica',player:'',kind:'Przechwyt',counter:'Nie',goal:'Nie',note:''},
  f:[{k:'team',l:'Drużyna',o:TEAM},{k:'player',l:'Zawodnik',o:pl,show:isP},{k:'kind',l:'Typ',o:['Przechwyt','Zebranie drugiej piłki'],note:'Odbiór po wygranym pojedynku loguj jako pojedynek.'},
   {k:'counter',l:'Do kontry',o:TN},{k:'goal',l:'Doprowadził do bramki',o:TN}]},
 str:{d:{team:'Pilica',player:'',kind:'Niecelne podanie',danger:'Nie',goal:'Nie',note:''},
  f:[{k:'team',l:'Drużyna',o:TEAM},{k:'player',l:'Zawodnik',o:pl,show:isP},{k:'kind',l:'Typ',o:['Niecelne podanie','Błąd techniczny'],note:'Stratę po przegranym pojedynku loguj jako pojedynek.'},
   {k:'danger',l:'Groźna: rywal może wyjść z kontrą',o:TN},{k:'goal',l:'Doprowadziła do bramki',o:TN}]},
 wej:{d:{team:'Pilica',player:'',how:'Podanie',contacts:1,end:'Strata',note:''},
  f:[{k:'team',l:'Drużyna',o:TEAM},{k:'player',l:'Kto wszedł',o:pl,show:isP},{k:'how',l:'Sposób wejścia',o:['Podanie','Drybling','Dośrodkowanie','SFG']},
   {k:'contacts',l:'Kontakty z piłką w polu karnym',type:'num'},{k:'end',l:'Jak się skończyło',o:['Strzał','Strata','Wybicie rywala','Wyjście z pola karnego']}]},
 cross:{d:{team:'Pilica',player:'',res:'Niecelne',shot:'Nie',note:''},
  f:[{k:'team',l:'Drużyna',o:TEAM},{k:'player',l:'Kto dośrodkował',o:pl,show:isP,note:'Pierwsze kliknięcie na boisku to miejsce startu, drugie to miejsce dogrania.'},
   {k:'res',l:'Wynik',o:['Celne','Niecelne','Zablokowane']},{k:'shot',l:'Zakończone strzałem',o:TN}]},
 sfg:{d:{team:'Pilica',kind:'Rzut rożny',player:'',won:'Brak',play:'Dośrodkowanie',acc:'Niecelne',first:'Rywal',shot:'Nie',note:''},
  f:[{k:'team',l:'Drużyna',o:TEAM},{k:'kind',l:'Typ',o:['Rzut rożny','Rzut wolny','Daleki aut','Karny']},{k:'player',l:'Wykonawca',o:pl,show:isP},
   {k:'won',l:'Kto wywalczył',o:plB,show:isP,note:'Po faulu zaznaczonym w pojedynku to pole wypełnia się samo.'},
   {k:'play',l:'Rozegranie',o:['Dośrodkowanie','Krótko','Strzał'],show:function(f){return f.kind!=='Karny';}},
   {k:'acc',l:'Dośrodkowanie',o:['Celne','Niecelne'],show:function(f){return f.kind!=='Karny'&&f.play==='Dośrodkowanie';}},
   {k:'first',l:'Pierwszy kontakt',o:TEAM,show:function(f){return f.kind!=='Karny';}},
   {k:'shot',l:'Zakończone strzałem',o:TN,show:function(f){return f.kind!=='Karny';}}]}
};

/* ---------- pochodne znaczniki ---------- */
function derive(e){
 var d={odb:0,odbK:0,str:0,strG:0,duel:0,duelKind:'',duelSide:'',duelWon:0,duelPlayer:'',wej:0,sfgWon:'',big:0,sam:0,empty:0,goal:0,onT:0,cats:[]};
 if(e.type==='shot'){
  d.goal=e.res==='Gol'?1:0;d.onT=(e.res==='Gol'||e.res==='Obroniony')?1:0;
  d.big=(e.phase==='Karny'||inBigZone(e.x,e.y,e.team))?1:0;
  if(e.phase!=='Karny'){d.sam=isSam(e)?1:0;d.empty=e.gk==='Pusta bramka'?1:0;}
  if(e.body==='Głowa'&&e.air==='Tak'&&e.phase!=='Karny'){
   if(e.team==='P'){d.duel=1;d.duelKind='W powietrzu';d.duelSide='Atak';d.duelWon=1;d.duelPlayer=e.player;}
   else if(e.airOpp&&e.airOpp!=='Brak'){d.duel=1;d.duelKind='W powietrzu';d.duelSide='Obrona';d.duelWon=0;d.duelPlayer=e.airOpp;}
  }
  d.cats.push('shot');
 }
 if(e.type==='duel'){
  d.duel=1;d.duelKind=e.kind;d.duelSide=e.side;d.duelWon=e.res==='Wygrany'?1:0;d.duelPlayer=e.player;
  if(e.out==='Przejęcie'||e.out==='Przejęcie do kontry'){d.odb=1;}
  if(e.out==='Przejęcie do kontry'){d.odbK=1;}
  if(e.out==='Strata'||e.out==='Strata do kontry'){d.str=1;}
  if(e.out==='Strata do kontry'){d.strG=1;}
  if(e.out==='Faul na nas'||e.out==='Faul rywala'){d.sfgWon=e.player;}
  d.cats.push(e.kind==='W powietrzu'?'air':'duel');
 }
 if(e.type==='odb'){d.odb=1;d.odbK=e.counter==='Tak'?1:0;}
 if(e.type==='str'){d.str=1;d.strG=e.danger==='Tak'?1:0;}
 if(e.type==='wej'){d.wej=1;}
 if(e.type==='cross'&&e.res==='Celne'){d.wej=1;}
 if(e.type==='sfg'&&e.kind!=='Karny'&&e.play==='Dośrodkowanie'&&e.acc==='Celne'){d.wej=1;}
 if(d.odb){d.cats.push('odb');}
 if(d.str){d.cats.push('str');}
 if(e.type==='wej'||e.type==='cross'||e.type==='sfg'){d.cats.push(e.type);}
 return d;
}
function autoTags(e){
 var d=derive(e),t=[];
 if(e.type==='shot'){var c=shotCalc(e);t.push('xG '+f2(c.xg));if(d.big){t.push('duża szansa');}if(e.setka==='Tak'){t.push('setka');}if(d.sam){t.push('sam na sam');}if(d.empty){t.push('pusta bramka');}
  if(d.duel){t.push((d.duelWon?'wygrany':'przegrany')+' pojedynek w powietrzu'+(e.team==='R'?': '+disp(d.duelPlayer):''));}}
 if(e.type==='duel'){if(d.odbK){t.push('odbiór do kontry');}else if(d.odb){t.push('odbiór');}if(d.strG){t.push('groźna strata');}else if(d.str){t.push('strata');}if(d.sfgWon){t.push('wywalczony stały fragment');}}
 if(e.type==='odb'&&d.odbK){t.push('odbiór do kontry');}
 if(e.type==='str'&&d.strG){t.push('groźna strata');}
 if((e.type==='cross'||e.type==='sfg')&&d.wej){t.push('wejście w pole karne');}

function teamStats(evs){
 var A={P:{1:{},2:{}},R:{1:{},2:{}}};
 function add(t,h,k,v){A[t][h][k]=(A[t][h][k]||0)+(v===undefined?1:v);}
 evs.forEach(function(e){
  var d=derive(e),t=e.team,h=e.half===2?2:1;
  if(e.type==='shot'){add(t,h,'strz');add(t,h,'xg',shotCalc(e).xg);if(d.goal){add(t,h,'gole');}if(d.onT){add(t,h,'celne');}else if(e.res==='Zablokowany'){add(t,h,'zabl');}else{add(t,h,'niec');}if(d.big){add(t,h,'duze');}if(e.setka==='Tak'){add(t,h,'setki');}}
  if(d.duel){add('P',h,'poj');if(d.duelWon){add('P',h,'pojW');}}
  if(d.odb){add(t,h,'odb');add(t,h,'odb'+zoneOf(e));if(d.odbK){add(t,h,'odbK');}if((t==='P'&&e.x>52.5)||(t==='R'&&e.x<52.5)){add(t,h,'odbPR');}}
  if(d.str){add(t,h,'str');add(t,h,'str'+zoneOf(e));if(d.strG){add(t,h,'strG');}}
  if(d.wej){add(t,h,'wej');add(t,h,'wej'+sectorOf(e));}
  if(e.type==='wej'){add(t,h,'kont',Number(e.contacts)||0);}
  if(e.type==='cross'||(e.type==='sfg'&&e.kind!=='Karny'&&e.play==='Dośrodkowanie')){add(t,h,'dosr');if((e.type==='cross'?e.res:e.acc)==='Celne'){add(t,h,'dosrC');}}
  if(e.type==='sfg'){add(t,h,'sfg');}
 });
 return A;
}
function playerStats(ms){
 var P={};function g(n){if(!P[n]){P[n]={min:0,strz:0,gole:0,xg:0,as:0,xa:0,duze:0,d1:0,d1w:0,da:0,daw:0,odb:0,str:0,strG:0,wej:0,dos:0,dosC:0,sfgW:0};}return P[n];}
 ms.forEach(function(m){
  var iv=intervals(m);Object.keys(iv).forEach(function(n){g(n).min+=iv[n].min;});
  m.events.forEach(function(e){
   var d=derive(e);
   if(d.duel&&d.duelPlayer){var q=g(d.duelPlayer);if(d.duelKind==='W powietrzu'){q.da++;q.daw+=d.duelWon;}else{q.d1++;q.d1w+=d.duelWon;}}
   if(e.team!=='P'||!e.player){return;}
   var p=g(e.player);
   if(e.type==='shot'){var c=shotCalc(e);p.strz++;p.xg+=c.xg;p.gole+=d.goal;p.duze+=d.big;if(e.assist&&e.assist!=='Brak'){var a=g(e.assist);a.xa+=c.xg;a.as+=d.goal;}}
   if(d.odb){p.odb++;}if(d.str){p.str++;}if(d.strG){p.strG++;}
   if(e.type==='wej'){p.wej++;}
   if(e.type==='cross'){p.dos++;if(e.res==='Celne'){p.dosC++;}}
   if(d.sfgWon){p.sfgW++;}
  });
 });
 return P;
}

    'Asysta':e.type==='shot'&&e.assist!=='Brak'?e.assist:'','Część ciała':e.body||'','Faza akcji':e.phase||'','Typ asysty':e.type==='shot'?e.atype:'','Presja':e.type==='shot'&&e.phase!=='Karny'?PRESS[e.press]:'','Obrońcy w świetle bramki':e.type==='shot'&&e.phase!=='Karny'?e.def:'','Bramkarz':e.type==='shot'&&e.phase!=='Karny'?e.gk:'','Miejsce w bramce':e.type==='shot'&&d.onT?e.spot:'',
    'Odległość (m)':c?c.dist:'','Kąt (°)':c?c.angle:'','xG app':c?c.app:'','xG':c?c.xg:'','Gol':c?d.goal:'','Celny':c?d.onT:'','Duża szansa':c?d.big:'','Setka':c?(e.setka==='Tak'?1:0):'','Sam na sam':c?d.sam:'','Pusta bramka':c?d.empty:'','Blokujący':e.type==='shot'&&e.res==='Zablokowany'&&e.blocker!=='Brak'?e.blocker:'',
    'Pojedynek':d.duel,'Pojedynek typ':d.duelKind,'Pojedynek faza':d.duelSide,'Pojedynek wygrany':d.duel?d.duelWon:'','Pojedynek zawodnik':d.duelPlayer,'Skutek pojedynku':e.type==='duel'?e.out:'','Kartka':e.type==='duel'&&e.card!=='Brak'&&e.out.indexOf('aul')>=0?e.card:'',
    'Odbiór':d.odb,'Odbiór do kontry':d.odbK,'Strata':d.str,'Groźna strata':d.strG,'Doprowadziło do bramki':e.goal==='Tak'?1:0,
    'Wejście w pk':d.wej,'Sposób wejścia':e.type==='wej'?e.how:e.type==='cross'&&d.wej?'Dośrodkowanie':e.type==='sfg'&&d.wej?'SFG':'','Kontakty w pk':e.type==='wej'?e.contacts:'','Zakończenie wejścia':e.type==='wej'?e.end:'',
    'Dośrodkowanie':(e.type==='cross'||(e.type==='sfg'&&e.kind!=='Karny'&&e.play==='Dośrodkowanie'))?1:0,'Dośrodkowanie celne':e.type==='cross'?(e.res==='Celne'?1:0):(e.type==='sfg'&&e.kind!=='Karny'&&e.play==='Dośrodkowanie')?(e.acc==='Celne'?1:0):'',
    'SFG typ':e.type==='sfg'?e.kind:'','SFG wywalczył':e.type==='sfg'?(e.won!=='Brak'?e.won:''):d.sfgWon,'SFG rozegranie':e.type==='sfg'&&e.kind!=='Karny'?e.play:'','Pierwszy kontakt':e.type==='sfg'&&e.kind!=='Karny'?e.first:'','Zakończone strzałem':(e.type==='cross'||(e.type==='sfg'&&e.kind!=='Karny'))?(e.shot==='Tak'?1:0):'',
    'Notatka':e.note||'','ID':e.id};
   ev.push(row);
   if(c){if(e.team==='P'){xp+=c.xg;p+=d.goal;}else{xr+=c.xg;r+=d.goal;}}
  });
  ma.push({'Mecz':name,'Data':m.date||'','Rywal':m.opp,'Miejsce':m.venue||'','Rozgrywki':m.comp||'','Kolejka':m.round||'','Gole Pilica':p,'Gole rywal':r,'xG Pilica':Math.round(xp*1000)/1000,'xG rywal':Math.round(xr*1000)/1000,'Liczba zdarzeń':m.events.length,'Długość meczu':Number(m.len)||90});
  var iv=intervals(m);Object.keys(iv).forEach(function(n){sq.push({'Mecz':name,'Data':m.date||'','Rywal':m.opp,'Zawodnik':n,'Pozycja':iv[n].pos,'Start':iv[n].start,'Od minuty':iv[n].from===null?'':iv[n].from,'Do minuty':iv[n].to===null?'':iv[n].to,'Minuty':iv[n].min});});
 });
 return {ev:ev,ma:ma,sq:sq};
}
function doExport(){
 if(typeof XLSX==='undefined'){UI.msg='Nie udało się załadować biblioteki Excel. Sprawdź połączenie z internetem i odśwież stronę.';render();return;}
 var R=exportRows(),wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(R.ev),'Zdarzenia');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(R.ma),'Mecze');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(R.sq),'Składy');
 var js=JSON.stringify(DB),chunks=[['Nie edytuj: kopia danych aplikacji']],i;
 for(i=0;i<js.length;i+=30000){chunks.push([js.slice(i,i+30000)]);}
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(chunks),'_dane');
 XLSX.writeFile(wb,'Pilica_logi.xlsx');
 UI.msg='Zapisano plik Pilica_logi.xlsx. Mecze: '+R.ma.length+', zdarzenia: '+R.ev.length+'.';render();
}
function doImport(file){
 if(typeof XLSX==='undefined'){UI.msg='Nie udało się załadować biblioteki Excel.';render();return;}
 var rd=new FileReader();
 rd.onload=function(){
  try{var wb=XLSX.read(rd.result,{type:'array'}),ws=wb.Sheets['_dane'];if(!ws){throw new Error('brak');}
   var a=XLSX.utils.sheet_to_json(ws,{header:1}),js=a.slice(1).map(function(r){return r[0];}).join(''),d=JSON.parse(js);
   if(!d||!d.matches){throw new Error('zły');}
   DB=d;if(!M()){DB.cur=DB.matches.length?DB.matches[DB.matches.length-1].id:null;}saveDB();UI.msg='Wczytano plik. Liczba meczów: '+DB.matches.length+'.';
  }catch(e){UI.msg='Tego pliku nie da się wczytać. Wybierz plik zapisany przez tę aplikację.';}
  render();
 };
 rd.readAsArrayBuffer(file);
}

/* ---------- render i zdarzenia ---------- */
function render(){
 renderHeader();
 var h=UI.tab==='log'?logHTML():UI.tab==='map'?mapHTML():UI.tab==='sum'?sumHTML():UI.tab==='squad'?squadHTML():dataHTML();
 $('#app').innerHTML=h;
}
function svgPoint(svg,ev){
 var pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;
 var p=pt.matrixTransform(svg.getScreenCTM().inverse());
 return {x:Math.round(Math.max(0,Math.min(105,p.x))*10)/10,y:Math.round(Math.max(0,Math.min(68,p.y))*10)/10};
}
document.addEventListener('click',function(ev){
 var pitch=ev.target.closest&&ev.target.closest('#pitch');
 if(pitch){var p=svgPoint(pitch,ev);if(UI.pts.length>=2){UI.pts=[p];}else{UI.pts.push(p);}render();return;}
 var b=ev.target.closest&&ev.target.closest('[data-act]');if(!b){return;}
 var a=b.dataset.act,v=b.dataset.v,m=M(),L;
 if(a!=='del'&&a!=='mdel'&&a!=='rowdel'){UI.confirm=null;}
 switch(a){
  case 'tab':UI.tab=v;UI.err='';UI.msg='';break;
  case 'half':UI.half=Number(v);if(UI.form){UI.form.half=UI.half;}break;
  case 'new':newForm(v);return;
  case 'edit':editForm(b.dataset.id);return;
  case 'set':UI.form.f[b.dataset.k]=v;normalize(UI.form);UI.err='';break;
  case 'num':UI.form.f[b.dataset.k]=Math.max(1,(Number(UI.form.f[b.dataset.k])||1)+Number(b.dataset.d));break;
  case 'save':saveForm();return;
  case 'cancel':UI.form=null;UI.err='';UI.pts=[];break;
  case 'clearpts':UI.pts=[];break;
  case 'del':if(UI.confirm!=='del'+b.dataset.id){UI.confirm='del'+b.dataset.id;break;}
   m.events=m.events.filter(function(e){return e.id!==b.dataset.id;});saveDB();UI.form=null;UI.pts=[];UI.confirm=null;UI.msg='Usunięto zdarzenie.';break;
  case 'rowdel':if(UI.confirm!=='row'+b.dataset.id){UI.confirm='row'+b.dataset.id;break;}
   m.events=m.events.filter(function(e){return e.id!==b.dataset.id;});saveDB();if(UI.form&&UI.form.editId===b.dataset.id){UI.form=null;UI.pts=[];}UI.confirm=null;UI.msg='Usunięto zdarzenie.';break;
  case 'mscope':UI.map.scope=v;UI.map.player='Wszyscy';break;
  case 'mteam':UI.map.team=v;break;
  case 'mperiod':UI.map.period=v;break;
  case 'mview':UI.map.view=v;break;
  case 'mplayer':UI.map.player=v;break;
  case 'mtype':UI.map.types[v]=!UI.map.types[v];break;
  case 'sscope':UI.sum.scope=v;break;
  case 'lu':L=lineup(m);var n=DB.roster[Number(b.dataset.i)];
   L.start=L.start.filter(function(p){return p.n!==n;});L.bench=L.bench.filter(function(x){return x!==n;});
   if(v==='XI'){L.start.push({n:n,pos:''});}else if(v==='Ławka'){L.bench.push(n);}saveDB();break;
  case 'subadd':L=lineup(m);var mn=Number($('#sMin').value),o=$('#sOut').value,i=$('#sIn').value;
   if(!mn||!o||!i){UI.err='Podaj minutę oraz obu zawodników.';break;}
   L.subs.push({min:mn,out:o,inn:i,pos:$('#sPos').value.trim()});UI.err='';saveDB();break;
  case 'subdel':lineup(m).subs.splice(Number(b.dataset.i),1);saveDB();break;
  case 'madd':var opp=$('#nOpp').value.trim();if(!opp){UI.err='Wpisz nazwę rywala.';break;}
   var nm={id:uid(),date:$('#nDate').value,opp:opp,venue:$('#nVenue').value,comp:$('#nComp').value,round:$('#nRound').value.trim(),len:90,lineup:{start:[],bench:[],subs:[]},events:[]};
   DB.matches.push(nm);DB.cur=nm.id;UI.err='';UI.msg='';saveDB();break;
  case 'pick':DB.cur=b.dataset.id;UI.form=null;UI.pts=[];saveDB();break;
  case 'mdel':if(UI.confirm!=='m'+b.dataset.id){UI.confirm='m'+b.dataset.id;break;}
   DB.matches=DB.matches.filter(function(x){return x.id!==b.dataset.id;});if(DB.cur===b.dataset.id){DB.cur=DB.matches.length?DB.matches[DB.matches.length-1].id:null;}UI.confirm=null;saveDB();break;
  case 'export':doExport();return;
  case 'roster':var r=$('#rosterTa').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);if(r.length){DB.roster=r;saveDB();UI.msg='Zapisano kadrę. Liczba zawodników: '+r.length+'.';}break;
 }
 render();
});
document.addEventListener('change',function(ev){
 var t=ev.target,m=M();
 if(t.id==='matchSel'){DB.cur=t.value;UI.form=null;UI.pts=[];saveDB();render();}
 else if(t.id==='impFile'&&t.files[0]){doImport(t.files[0]);}
 else if(t.id==='mLen'&&m){m.len=Number(t.value)||90;saveDB();render();}
 else if(t.dataset&&t.dataset.pos!==undefined&&m){var n=DB.roster[Number(t.dataset.pos)];lineup(m).start.forEach(function(p){if(p.n===n){p.pos=t.value.trim();}});saveDB();}
 else if(t.id==='minInp'&&UI.tab==='log'&&UI.form){UI.form.min=t.value;var pc=$('#panelCard');if(pc){pc.innerHTML=formHTML();}}
});
document.addEventListener('input',function(ev){if(ev.target.id==='noteInp'&&UI.form){UI.form.f.note=ev.target.value;}});
document.addEventListener('keydown',function(ev){
 var tg=ev.target.tagName,typing=tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT';
 if(UI.tab!=='log'||ev.ctrlKey||ev.metaKey||ev.altKey){return;}
 if(ev.key==='Escape'&&UI.form){UI.form=null;UI.err='';UI.pts=[];render();return;}
 if(ev.key==='Enter'&&UI.form&&tg!=='BUTTON'&&tg!=='TEXTAREA'){ev.preventDefault();saveForm();return;}
 if(typing||UI.form){return;}
 var k=ev.key.toLowerCase();
 for(var i=0;i<TYPES.length;i++){if(TYPES[i][2].toLowerCase()===k){ev.preventDefault();newForm(TYPES[i][0]);return;}}
});
loadDB();
if(!M()&&DB.matches.length){DB.cur=DB.matches[DB.matches.length-1].id;}
if(!DB.matches.length){UI.tab='data';}
render();
</script>
